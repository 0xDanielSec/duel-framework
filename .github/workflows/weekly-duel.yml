name: Weekly DUEL Battle

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday 08:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

permissions:
  contents: write           # Required to push the results branch
  pull-requests: write      # Required to open the weekly results PR

jobs:
  weekly-battle:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # 8 techniques × ~10 min each

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        timeout-minutes: 30
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify GROQ_API_KEY is set
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "::error::GROQ_API_KEY secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          echo "GROQ_API_KEY is present (${#GROQ_API_KEY} chars)"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Pre-flight — configured models exist on Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, sys, requests
          src = open("scripts/weekly_battle.py", encoding="utf-8").read()
          wanted = {k: re.search(rf'^{k}\s*=\s*"([^"]+)"', src, re.M).group(1)
                    for k in ("ATTACKER_MODEL", "DEFENDER_MODEL")}
          r = requests.get("https://api.groq.com/openai/v1/models",
                           headers={"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"},
                           timeout=30)
          r.raise_for_status()
          live = {m["id"] for m in r.json()["data"]}
          missing = {k: v for k, v in wanted.items() if v not in live}
          if missing:
              print(f"::error::Model(s) not available on Groq: {missing}. Update scripts/weekly_battle.py.")
              sys.exit(1)
          print("Models OK:", wanted)
          PY

      - name: Create output directory
        run: mkdir -p output

      - name: Run weekly battle — all 8 techniques
        timeout-minutes: 30
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/weekly_battle.py

      - name: Generate GitHub Pages data
        timeout-minutes: 30
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_pages_data.py

      - name: Commit results and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md docs/data.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="weekly/${DATE}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore: weekly automated battle ${DATE}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: weekly automated battle ${DATE}" \
            --body "Automated weekly DUEL battle results. Merge to update the README badge and docs/data.json."